name: Build Windows MSYS2
on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sys: mingw64

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{matrix.sys}}
          pacboy: >-
            toolchain:p
            cmake:p
            meson:p
            nasm:p
      - name: cmake
        run: mkdir build && cd build && cmake -G "MinGW Makefiles" ..
      - name: make
        run: cd build && make

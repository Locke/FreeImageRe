name: Build GNU/Linux
on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gcc: 10
          - os: ubuntu-latest
            gcc: 13

    env:
      CC: gcc-${{ matrix.gcc }}
      CXX: g++-${{ matrix.gcc }}

    steps:
      - uses: actions/checkout@v6
      - name: install build dependencies
        run: sudo apt install -y meson nasm gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }}
      - name: cmake
        run: mkdir build && cd build && cmake ..
      - name: make
        run: cd build && make
